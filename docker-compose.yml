services:
  feedback-api:
    build: .
    ports:
      - "3001:3001"
    environment:
      - API_KEY=change-me-in-production
      - DATA_DIR=/data
    volumes:
      - feedback-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  feedback-data: